      - generic [ref=e106]: Step 0 · Preparation
      - heading "Before you start — keep these ready" [level=2] [ref=e109]
      - paragraph [ref=e110]: Having everything at hand lets you finish the application in one sitting. You have 7 days from registration to complete all steps and pay.
      - generic [ref=e111]:
        - generic [ref=e112]:
          - heading "Documents" [level=4] [ref=e113]
          - list [ref=e114]:
            - listitem [ref=e115]: PAN card of the agency (PDF, JPG or PNG, max 2 MB)
            - listitem [ref=e116]: Aadhaar card of every key person and the authorised signatory
            - listitem [ref=e117]: Agency letterhead with the authorised signatory's signature (max 5 MB at sign-up)
            - listitem [ref=e118]: TAN / GSTIN certificates, if applicable
            - listitem [ref=e119]: Incorporation / Registration certificate, address proof and office photograph
            - listitem [ref=e120]: Licences — Contract Labour, Emigration, Security Agency, LIN — if you hold them
        - generic [ref=e121]:
          - heading "Also required" [level=4] [ref=e122]
          - list [ref=e123]:
            - listitem [ref=e124]: Active email & mobile — both are verified by OTP
            - listitem [ref=e125]: Official agency email must differ from every key person's personal email
            - listitem [ref=e126]: Maharashtra office — at least one office in Maharashtra is mandatory
            - listitem [ref=e127]: Signing facility — declaration forms are printed, signed on letterhead, scanned and uploaded
            - listitem [ref=e128]: Payment method — the registration fee is paid online at the end
        - generic [ref=e129]:
          - heading "General form rules" [level=4] [ref=e130]
          - list [ref=e131]:
            - listitem [ref=e132]: Dates in DD/MM/YYYY — future dates are not allowed
            - listitem [ref=e133]: Pincodes — only Maharashtra pincodes (400000 – 445999)
            - listitem [ref=e134]: Mandatory fields are marked with a red *
            - listitem [ref=e135]: Save & continue — steps unlock in order; a saved step is read-only until you click “Edit this section”
            - listitem [ref=e136]: Uploads in Enclosures and Declaration must be PDF, max 2 MB per file
